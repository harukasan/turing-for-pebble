[settings]
enable_tools = ["python", "node", "pnpm", "ruff", "shellcheck", "shfmt"]

[tools]
python = "3.13.15"
node = "24.19.0"
pnpm = "10.33.0"
ruff = "0.16.8"
shellcheck = "0.11.0"
shfmt = "3.14.1"

[env]
_.python.venv = { path = ".venv", create = true }
XDG_DATA_HOME = "{{ config_root }}/.local/share"
XDG_CACHE_HOME = "{{ config_root }}/.local/cache"

[tasks.setup]
description = "Install pinned Pebble tooling into the project virtualenv"
run = "python -m pip install -r requirements-tools.lock"

[tasks.pebble]
description = "Run Pebble with project-local SDK storage"
run = "pebble"

[tasks.sdk-install]
description = "Install pinned Emery SDK into project-local storage"
run = "pebble sdk install 4.33.1"

[tasks.test-core]
run = "sh scripts/test-core.sh"

[tasks.build-wasm]
run = "sh scripts/build-wasm.sh"

[tasks.build-pebble]
run = "sh scripts/build-pebble.sh"

[tasks.lint-js]
description = "ESLint and Prettier check"
run = ["pnpm run lint", "pnpm run format:check"]

[tasks.lint-c]
description = "clang-format check and cc -Wall -Wextra -Werror syntax check"
run = "sh scripts/lint-c.sh"

[tasks.lint-py]
description = "ruff check and ruff format --check on scripts/"
run = ["ruff check scripts", "ruff format --check scripts"]

[tasks.lint-sh]
description = "shellcheck and shfmt -d on scripts/"
run = ["shellcheck scripts/*.sh", "shfmt -i 2 -ci -d scripts/*.sh"]

[tasks.lint]
description = "All lint and format checks"
depends = ["lint-js", "lint-c", "lint-py", "lint-sh"]

[tasks.format-js]
description = "Format Web sources with Prettier"
run = "pnpm run format"

[tasks.format-c]
description = "Format C sources with clang-format"
run = "clang-format -i core/*.c core/*.h pebble/src/c/*.c pebble/src/c/*.h tests/*.c"

[tasks.format-py]
description = "Sort imports and format Python scripts with ruff"
run = ["ruff check --select I --fix scripts", "ruff format scripts"]

[tasks.format-sh]
description = "Format shell scripts with shfmt"
run = "shfmt -i 2 -ci -w scripts/*.sh"

[tasks.format]
description = "Rewrite all sources with the project formatters"
depends = ["format-js", "format-c", "format-py", "format-sh"]
